<style>
:root{--p:#6D28D9;--pd:#2E1065;--o:#F59E0B;--o2:#F97316;--cream:#FFFBF0;--card:#FFFDF7;--ink:#1F1147;--muted:#6B5E8E;--line:#E4DAF7;--soft:#FFF3D6;--green:#16a34a;--red:#dc2626;--pink:#EC4899;--teal:#0D9488;--blue:#3B82F6;
--fh:'Rasa','Noto Serif Gujarati',serif;--fb:'Hind Vadodara','Noto Sans Gujarati','Segoe UI',system-ui,sans-serif;--fn:'Baloo Bhai 2','Hind Vadodara',sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light}
body{margin:0;font-family:var(--fb);color:var(--ink);line-height:1.5;background:radial-gradient(700px 420px at 0% 0%,rgba(245,158,11,.38),transparent 60%),radial-gradient(700px 420px at 100% 10%,rgba(109,40,217,.32),transparent 60%),radial-gradient(800px 500px at 50% 110%,rgba(52,211,153,.26),transparent 60%),#FFFBF0 fixed;min-height:100vh}
h1,h2,h3{font-family:var(--fh);font-weight:700;margin:0;color:var(--pd)}
h1{font-size:1.5rem}h2{font-size:1.2rem}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 16px 16px 20px;margin:12px 0;box-shadow:0 8px 26px rgba(46,16,101,.10);overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(180deg,#ef4444,#f59e0b,#eab308,#22c55e,#06b6d4,#6366f1,#a855f7)}
.btn{display:inline-block;border:none;border-radius:14px;padding:11px 18px;font:700 1rem var(--fb);color:#fff;background:linear-gradient(135deg,var(--p),var(--pd));box-shadow:0 6px 16px rgba(109,40,217,.35);cursor:pointer;margin:4px 6px 4px 0;touch-action:manipulation}
.btn.or{background:linear-gradient(135deg,var(--o),var(--o2));box-shadow:0 6px 16px rgba(249,115,22,.35)}
.btn.ghost{background:transparent;color:var(--p);border:2px solid var(--p);box-shadow:none}
.btn.red{background:linear-gradient(135deg,#ef4444,#b91c1c)}.btn.green{background:linear-gradient(135deg,#22c55e,#15803d)}
.btn:disabled{opacity:.5;cursor:default}
input,textarea{width:100%;padding:11px 12px;border-radius:14px;border:2px solid var(--p);background:#fff;color:var(--ink);font:500 1rem var(--fb);margin:5px 0 10px}
.muted{color:var(--muted);font-size:.9rem}
.pill{display:inline-block;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:.85rem;font-weight:600;margin:2px}
.zchip{display:inline-block;border-radius:999px;padding:4px 14px;font-weight:700;color:#fff;font-size:.9rem}
.big{font-family:var(--fn);font-weight:800}
.bar{height:9px;border-radius:999px;background:var(--line);overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--o),var(--o2));transition:width .3s}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.coin{width:120px;height:120px;display:block;margin:6px auto 0;filter:drop-shadow(0 8px 14px rgba(46,16,101,.35))}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes tileIn{0%{transform:scale(.4) rotate(-12deg);opacity:0;filter:brightness(2)}100%{transform:none;opacity:1}}

.wrap{max-width:980px}
textarea,input,select{width:100%}
label{font-weight:600;font-size:.9rem;color:var(--pd)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.78rem;margin:2px}
.code{font-family:var(--fn);font-size:2.4rem;letter-spacing:6px;color:var(--p);font-weight:800}
.btn.sm{padding:7px 12px;font-size:.88rem}
.btn[disabled]{opacity:.4;pointer-events:none}
/* stage = projector scene (dark, like the Ranbhoomi board) */
.stage{position:relative;border-radius:18px;padding:22px 26px;color:#FFF3D6;min-height:380px;display:flex;flex-direction:column;gap:16px;background:radial-gradient(900px 500px at 100% 0%,var(--s1),transparent 60%),radial-gradient(700px 400px at 0% 100%,var(--s2),transparent 60%),var(--sb)}
.pjroot{min-height:100vh;border-radius:0;padding:32px 56px;font-size:calc(14px + .5vw)}
.kick{font-size:.95em;font-weight:600;letter-spacing:.14em;color:var(--ac)}
.big{font-family:var(--fh);font-weight:700;line-height:1.15;font-size:2.6em;color:#FFF3D6}
.tag{padding:8px 16px;border-radius:12px;background:var(--sc);font-size:1em}
.tm{padding:8px 20px;border-radius:12px;background:var(--ac);color:#1d1204;font-family:var(--fn);font-weight:800;font-size:1.8em}
.zgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;flex-grow:1}
.zc{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:16px;background:var(--sc)}
.zc .nm{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:1.2em}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block}
.fort{position:relative;flex-grow:1;min-height:90px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;overflow:hidden;border-radius:12px;background:#170B3B;padding-bottom:6px}
.fort i{display:block;height:12px;border-radius:3px}
.fort .tri{width:30px;height:22px;background:var(--ac);clip-path:polygon(50% 0,100% 100%,0 100%)}
.fog{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,43,46,.92),rgba(11,43,46,.55) 70%,rgba(11,43,46,.35));display:flex;align-items:center;justify-content:center;text-align:center;font-size:.8em;color:#E4DAF7;padding:0 8px}
.bar2{height:10px;border-radius:999px;background:#170B3B;overflow:hidden}.bar2>div{height:100%;transition:width .5s}
.sub{color:#C4B5FD;font-size:.9em}
.win{position:relative;text-align:center;padding:34px 14px;border-radius:22px;background:linear-gradient(160deg,var(--sp),var(--sc));box-shadow:0 0 0 3px rgba(255,215,0,.55),0 0 40px 8px rgba(255,215,0,.30);animation:pop .6s ease-out}
.win .cat{font-family:var(--fh);font-size:1.7em;font-weight:700;color:#FDE68A}
.win .av{font-size:4em;margin-top:6px}.win .nmx{font-family:var(--fh);font-size:2.4em;font-weight:700}
.win .sc{font-family:var(--fn);font-size:2.2em;color:var(--ac);font-weight:800}
.strip{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.strip>div{padding:6px 14px;border-radius:12px;background:var(--sc);font-size:.9em}
.names{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.names span{padding:5px 12px;border-radius:999px;background:var(--sc)}
.wheelbox{display:flex;justify-content:center}
.wheel{position:relative;width:min(70vw,420px);aspect-ratio:1}
.wheel svg{width:100%;height:100%}
.ptr{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:30px solid #F59E0B;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));z-index:2}

.mos div{aspect-ratio:1;background-size:500% 500%;border-radius:5px}
.qimg{max-height:160px;border-radius:12px;align-self:center}
.hl{display:flex;gap:6px;flex-wrap:wrap}
.plist{max-height:240px;overflow:auto;font-size:.86rem}

  $('#mk').onclick = () => { const names = $('#pnm').value.split(',').map(s=>s.trim()); socket.emit('host:create', { hostName:$('#hn').value, maxPlayers:+$('#mp').value, zones:$('#zn').value, qSec:+$('#qs').value, phaseNames:names, qaText:$('#qa').value }, r => { if (r && r.ok) { CODE = r.code; try{localStorage.setItem('sgRoom',CODE);}catch(e){} view='game'; } else $('#cerr').textContent = (r && r.error) || 'ભૂલ'; }); };
}
function ctrl(){
  const st = S.status, B = (ev, label, cls, extra, dis) => '<button class="btn sm '+(cls||'')+'" data-ev="'+ev+'" '+(extra||'')+(dis?' disabled':'')+'>'+label+'</button>';
  let b = '';
  if (st==='lobby') b = B('host:start','▶ શરૂ કરો (શુભ લાઇન પસંદગી)','or','',!S.nPlayers) + B('host:addBots','🤖 +20 Bots','ghost','data-n="20"');
  else if (st==='pick') b = B('host:skipPick','⏭ પસંદગી પૂરી કરો','or');
  else if (st==='active') b = B('host:spin','🎡 નંબર ફેરવો','or');
  else if (st==='spinning'||st==='revealing') b = '<span class="pill">ચાલુ…</span>';
  else if (st==='question') b = B('host:skipTimer','⏩ સમય પૂરો કરો','or') + (S.paused ? B('host:resume','▶ ફરી ચાલુ','') : B('host:pause','⏸ થોભો','ghost')) + B('host:adj','+10 સે','ghost','data-delta="10"') + B('host:adj','−10 સે','ghost','data-delta="-10"');
  else if (st==='locked') { const rem = S.used < (S.phase+1)*S.per; b = rem ? B('host:spin','🎡 આગલો નંબર ફેરવો','or') : B('host:startYuddh','⚔ યુદ્ધ શરૂ કરો','or'); }
  else if (st==='yuddh') b = B('host:skipYuddh','⏭ યુદ્ધ પૂરું','or');
  else if (st==='yuddhwait') b = B('host:nextPhase', S.phase<3 ? '➡ આગલો ફેઝ' : '🏁 અંતિમ તબક્કો','or');
  else if (st==='final') b = B('host:final','🎉 પરિણામ શરૂ કરો','or');
  else if (st==='reveal') b = B('host:prev','◀ પાછળ','ghost',"",S.reveal.step===0) + B('host:next','આગળ ▶','or','',S.reveal.step>=S.reveal.steps.length-1);
  return b;
}
function drawHost(){
  const keepTa = document.activeElement && document.activeElement.id==='nmIn';
  const q = S.curIdx!=null||S.qNo ? (S.questions||[])[S.qNo-1] : null;
  const pj = location.origin + '/host.html?pj=' + S.code + '&t=' + TH, plink = location.origin + '/?code=' + S.code;
  app.innerHTML = '<div class="wrap"><div class="card"><div class="row" style="justify-content:space-between"><div><h1>ધ સંગમ · '+esc(S.hostName||'')+'</h1><span class="pill">'+S.status+'</span><span class="pill">ખેલાડી '+S.nPlayers+'</span><span class="pill">'+S.qSec+' સે</span></div><div><span class="code">'+S.code+'</span></div></div>' +
    '<div class="row" style="margin-top:8px"><a class="btn sm ghost" href="'+pj+'" target="_blank" style="text-decoration:none">📽 Projector ખોલો</a>'+ctrl()+'<button class="btn sm ghost" data-ev="host:end" style="margin-left:auto">⛔ ગેમ સમાપ્ત</button></div>' +
    (q && (S.status==='question'||S.status==='locked'||S.status==='spinning'||S.status==='revealing') ? '<div class="ans" style="margin-top:8px">પ્રશ્ન '+S.qNo+' · જવાબ: '+esc(q.a)+'</div>' : '') + '</div>' +
    '<div class="stage" style="font-size:15px">'+scene()+'</div>' +
    '<div class="card"><h2>Player link</h2><div class="row"><input id="plk" readonly value="'+plink+'" style="flex:1;min-width:220px"><button class="btn sm" data-copy="'+plink+'">📋 Copy</button><a class="btn sm or" target="_blank" style="text-decoration:none" href="https://wa.me/?text='+encodeURIComponent('ધ સંગમ ગેમમાં જોડાઓ 👉 '+plink+'  (Room code: '+S.code+')')+'">WhatsApp</a></div><h2 style="margin-top:12px">Colour</h2><div>'+THEMES.map((t,i)=>'<span class="sw'+(i===TH?' on':'')+'" data-th="'+i+'" title="'+t.n+'" style="background:linear-gradient(135deg,'+t.sp+' 50%,'+t.ac+' 50%)"></span>').join('')+'</div><div class="muted" style="font-size:.8rem">Projector લિંક (Colour સહિત) "📽 Projector ખોલો" થી ખૂલે છે.</div></div>' +
    '<div class="card"><h2>ખેલાડીઓ</h2><div class="plist">'+(S.players||[]).map(p => '<span title="'+esc(p.zone)+'" style="border-color:'+zc(p.zone)+'">'+esc(p.avatar)+' '+esc(p.name)+' ('+esc(p.zone)+')'+(p.online?'':' ⚠')+(S.status==='lobby'?' <a href="#" data-kick="'+p.key+'" style="color:var(--red)">✕</a>':'')+'</span>').join('')+'</div></div>' +
    '<div class="card"><h2>ફેઝનાં નામ</h2><input id="nmIn" value="'+esc(S.phaseNames.join(', '))+'"><button class="btn sm" id="nmGo">સેવ</button> <label style="margin-left:10px">પ્રશ્ન સમય</label> <input id="qsIn" type="number" value="'+S.qSec+'" style="width:90px;display:inline-block"><button class="btn sm" id="qsGo">સેવ</button></div></div>';
  paintQR(); if (S.status==='spinning'||S.status==='revealing') spinWheel();
  const nm = $('#nmGo'); if (nm) nm.onclick = () => emit('host:setNames', { names:$('#nmIn').value.split(',') });
  const qg = $('#qsGo'); if (qg) qg.onclick = () => emit('host:setQSec', { sec:+$('#qsIn').value });
}
document.addEventListener('click', e => {
  const th = e.target.closest('[data-th]'); if (th) { applyTheme(+th.dataset.th); if (PJ) drawPJ(); else if (S) drawHost(); return; }
  const cp = e.target.closest('[data-copy]'); if (cp) { const t = cp.dataset.copy; const done = () => { cp.textContent = '✔ Copied'; }; try { navigator.clipboard.writeText(t).then(done, () => { const i = $('#plk'); i.select(); document.execCommand('copy'); done(); }); } catch(_) { const i = $('#plk'); i.select(); document.execCommand('copy'); done(); } return; }
  const b = e.target.closest('[data-ev]'); if (b && !PJ) { const a = {}; if (b.dataset.n) a.n = +b.dataset.n; if (b.dataset.delta) a.delta = +b.dataset.delta; if (b.dataset.ev==='host:end') { if (!b.dataset.sure) { b.dataset.sure=1; b.textContent='ખાતરી? ફરી દબાવો'; return; } try{localStorage.removeItem('sgRoom');}catch(_){} setTimeout(()=>location.reload(),300); } emit(b.dataset.ev, a); }
  const k = e.target.closest('[data-kick]'); if (k) { e.preventDefault(); emit('host:kick', { key:k.dataset.kick }); }
});
let drawT = null, lastSig = '';
socket.on('state', s => { S = s; if (PJ) return drawPJ(); if (view==='game' || view==='create'&&0) { if (document.activeElement && /^(nmIn|qsIn)$/.test(document.activeElement.id)) return; drawHost(); } });
function boot(){
  if (PJ) { socket.emit('pj:join', { code:PJ }, r => { if (!r || !r.ok) app.innerHTML = '<div class="stage pjroot"><div class="big">કોડ ખોટો: '+esc(PJ)+'</div></div>'; }); drawPJ(); return; }
  let cr = null; try { cr = JSON.parse(sessionStorage.getItem('sgH')||'null'); } catch(e){}
  if (cr) socket.emit('host:login', cr, r => { if (r && r.ok) afterLogin(); else loginView(); }); else loginView();
}
socket.on('connect', boot);
</script>
<script id="up-clock">
/* Server-clock sync: every phone/laptop uses the SAME clock (server time), so timers & number reveal match exactly */
(function(){
  var RAW=Date.now.bind(Date),SK=0,best=1e9,n=0;
  Date.now=function(){ return RAW()+SK; };
  window.__srvSkew=function(){ return SK; };
  function sample(){ try{ var t0=RAW(); socket.emit('time:sync',null,function(st){ if(typeof st!=='number') return; var t1=RAW(),rtt=t1-t0,off=st+rtt/2-t1;
      if(n<6||rtt<=best*1.5+30){ if(rtt<best) best=rtt; SK=(n<3)?off:Math.round(SK*.5+off*.5); n++; } }); }catch(e){} }
  function burst(){ best=1e9; n=0; for(var i=0;i<6;i++) setTimeout(sample,i*250); }
  try{ socket.on('connect',burst); if(socket.connected) burst(); }catch(e){}
  setInterval(sample,20000);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) burst(); });
})();
</script>
