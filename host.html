<style>
:root{--p:#6D28D9;--pd:#2E1065;--o:#F59E0B;--o2:#F97316;--cream:#FFFBF0;--card:#FFFDF7;--ink:#1F1147;--muted:#6B5E8E;--line:#E4DAF7;--soft:#FFF3D6;--green:#16a34a;--red:#dc2626;--pink:#EC4899;--teal:#0D9488;--blue:#3B82F6;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light}
body{margin:0;font-family:var(--fb);color:var(--ink);line-height:1.5;background:radial-gradient(700px 420px at 0% 0%,rgba(var(--srg,245,158,11),.38),transparent 60%),radial-gradient(700px 420px at 100% 10%,rgba(var(--rg,109,40,217),.32),transparent 60%),radial-gradient(800px 500px at 50% 110%,rgba(52,211,153,.26),transparent 60%),var(--tcream,#FFFBF0) fixed;min-height:100vh}
h1,h2,h3{font-family:var(--fh);font-weight:700;margin:0;color:var(--pd)}
h1{font-size:1.5rem}h2{font-size:1.2rem}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 16px 16px 20px;margin:12px 0;box-shadow:0 8px 26px rgba(46,16,101,.10);overflow:hidden}

.btn{display:inline-block;border:none;border-radius:14px;padding:11px 18px;font:700 1rem var(--fb);color:#fff;background:linear-gradient(135deg,var(--p),var(--pd));box-shadow:0 6px 16px rgba(109,40,217,.35);cursor:pointer;margin:4px 6px 4px 0;touch-action:manipulation}
.btn.or{background:linear-gradient(135deg,var(--o),var(--o2));box-shadow:0 6px 16px rgba(249,115,22,.35)}
.btn.ghost{background:transparent;color:var(--p);border:2px solid var(--p);box-shadow:none}
.btn.red{background:linear-gradient(135deg,#ef4444,#b91c1c)}.btn.green{background:linear-gradient(135deg,#22c55e,#15803d)}
.btn:disabled{opacity:.5;cursor:default}
input,textarea{width:100%;padding:11px 12px;border-radius:14px;border:2px solid var(--p);background:#fff;color:var(--ink);font:500 1rem var(--fb);margin:5px 0 10px}
.muted{color:var(--muted);font-size:.9rem}
.pill{display:inline-block;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:.85rem;font-weight:600;margin:2px}
.zchip{display:inline-block;border-radius:999px;padding:4px 14px;font-weight:700;color:#fff;font-size:.9rem}
.big{font-family:var(--fn);font-weight:800}
.bar{height:9px;border-radius:999px;background:var(--line);overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--o),var(--o2));transition:width .3s}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.coin{width:120px;height:120px;display:block;margin:6px auto 0;filter:drop-shadow(0 8px 14px rgba(46,16,101,.35))}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes tileIn{0%{transform:scale(.4) rotate(-12deg);opacity:0;filter:brightness(2)}100%{transform:none;opacity:1}}

.wrap{max-width:980px}
textarea,input,select{width:100%}
label{font-weight:600;font-size:.9rem;color:var(--pd)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.78rem;margin:2px}
.code{font-family:var(--fn);font-size:2.2rem;letter-spacing:6px;color:var(--p);font-weight:800}
.btn.sm{padding:8px 14px;font-size:.9rem}.btn.lg{padding:14px 22px;font-size:1.1rem}
.btn[disabled]{opacity:.4;pointer-events:none}
.pjbtn{background:linear-gradient(135deg,#6D28D9,#2E1065);color:#fff;border:0;border-radius:14px;padding:12px 18px;font:inherit;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block;box-shadow:0 6px 18px rgba(46,16,101,.35)}
.plist{max-height:240px;overflow:auto;font-size:.86rem}
.plist span{display:inline-block;margin:2px;padding:2px 8px;border-radius:999px;background:var(--soft);border:1px solid var(--line)}
.err{color:var(--red);font-weight:600;white-space:pre-wrap}
.ans{padding:12px 16px;border-radius:12px;background:#FEF3C7;border:1px dashed var(--o2);font-weight:700;font-size:1.05rem}
.qline{font-family:var(--fh);font-size:1.35rem;font-weight:700;color:var(--pd)}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:10px 0}
.stat>div{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:8px 12px}.stat small{display:block;color:var(--muted);font-size:.75rem}.stat b{font-family:var(--fn);font-size:1.5rem;color:var(--p)}
.zr{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:.88rem}.zr .bar{flex:1;height:10px;margin:0}
.sw{display:inline-block;width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);cursor:pointer;margin:3px}.sw.on{box-shadow:0 0 0 3px var(--p)}

.pre{display:inline-block;margin:3px;padding:8px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);font:600 .9rem var(--fb);cursor:pointer;color:var(--ink)}.pre.on{border-color:var(--p);box-shadow:0 0 0 3px rgba(var(--rg,109,40,217),.2)}
.cp{display:inline-flex;gap:6px;align-items:center;margin:4px 10px 4px 0;font-weight:600;font-size:.85rem}.cp input{width:46px;height:34px;padding:0;border:0;background:none}
</style>

@keyframes lsLogo{0%{opacity:0;transform:scale(.55) rotateY(-70deg);filter:blur(14px)}60%{opacity:1;filter:blur(0)}100%{opacity:1;transform:scale(1) rotateY(0);filter:blur(0)}}
@keyframes lsShine{to{background-position:-60% 0}}
#lsplash .ls-t{margin-top:min(4vmin,26px);font-family:var(--fn,'Baloo Bhai 2',sans-serif);font-weight:800;letter-spacing:.55em;margin-right:-.55em;font-size:clamp(.95rem,3.6vmin,1.7rem);color:var(--tl1,#FDE68A);text-shadow:0 0 18px rgba(var(--srg,245,158,11),.8);opacity:0;animation:lsUp .9s 2.7s ease both}
#lsplash .ls-w{margin-top:min(3vmin,18px);font-family:var(--fh,'Rasa',serif);font-weight:700;font-size:clamp(1.1rem,4vmin,1.8rem);color:#fff;opacity:0;animation:lsUp .9s 3.5s ease both;max-width:90vw;overflow-wrap:anywhere}
#lsplash .ls-d{display:flex;gap:10px;justify-content:center;margin-top:min(3vmin,20px);opacity:0;animation:lsUp .6s 4.2s ease both}
#lsplash .ls-d i{width:9px;height:9px;border-radius:50%;background:var(--ts,#F59E0B);animation:lsDot 1s infinite}#lsplash .ls-d i:nth-child(2){animation-delay:.2s}#lsplash .ls-d i:nth-child(3){animation-delay:.4s}
@keyframes lsDot{50%{transform:translateY(-7px);opacity:.4}}
@keyframes lsUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
#lsplash .ls-bar{position:absolute;left:0;right:0;height:9vh;background:#000;z-index:3;transform:scaleY(1);animation:lsBar 1.4s .2s ease both}

 var RAINBOW={wheel:[['#FF6B6B','#C62828'],['#FFB74D','#E65100'],['#FFEE58','#F9A825'],['#66BB6A','#2E7D32'],['#26C6DA','#00838F'],['#AB47BC','#6A1B9A'],['#FF8A65','#D84315']],

 var PRESETS={

 function derive(t){

 var cur=null,curKey='';

 function apply(t){

<script>
const socket = io(), $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ZC = ['#F59E0B','#EC4899','#0D9488','#3B82F6','#22C55E','#8B5CF6','#EF4444','#06B6D4'];
const TH = [['#5B21B6','#FDE68A'],['#0E7490','#FDE68A'],['#15803D','#FEF08A'],['#BE185D','#FED7AA'],['#C2410C','#FDE68A'],['#1D4ED8','#FDE68A'],['#0F766E','#FDE68A'],['#7F1D1D','#FDE68A']];
const TN = ['જાંબલી','નીલમ','લીલો','ગુલાબી','કેસરી','વાદળી','ટીલ','મરૂન'];
const SN = {lobby:'લોબી — ખેલાડીઓ જોડાઈ રહ્યા છે',pick:'શુભ લાઇન અને કવચ પસંદગી',active:'આગલો નંબર ફેરવવાનો સમય',spinning:'વ્હીલ ફરે છે…',revealing:'નંબર ખુલ્યો…',question:'પ્રશ્ન ચાલુ',locked:'સમય પૂરો',yuddh:'યુદ્ધ (બાણ / ઢાલ) ચાલુ',yuddhwait:'યુદ્ધ પૂરું',final:'બધા પ્રશ્નો પૂરા',reveal:'અંતિમ પરિણામ'};
let S = null, CODE = '', view = 'login';
const THEMEV = () => { const t = (S&&S.theme) || BGTheme.PRESETS.fun; return { p:t.p, s:t.s, bg:t.bg }; };
const curPre = () => { const t = THEMEV(); return Object.keys(BGTheme.PRESETS).find(k => { const q = BGTheme.PRESETS[k]; return q.p===t.p && q.s===t.s && q.bg===t.bg; }) || ''; };
const zc = z => ZC[Math.max(0,S.zones.indexOf(z)) % ZC.length];
const emit = (ev, a, cb) => socket.emit(ev, Object.assign({ code:CODE }, a||{}), cb);
const left = () => !S ? 0 : S.paused ? (S.pausedMs||0) : S.timerEnd ? S.timerEnd - Date.now() : 0;
const sec = ms => Math.max(0, Math.ceil(ms/1000));

function loginView(){
  view='login'; app.innerHTML = '<div class="wrap"><div class="card"><h1>ધ સંગમ · Host</h1><label>ID</label><input id="lid" autocomplete="username"><label>Password</label><input id="lpw" type="password" autocomplete="current-password"><button class="btn" id="lgo">Login</button><div class="err" id="lerr"></div></div></div>';
  const go = () => { const cr={id:$('#lid').value.trim(),pw:$('#lpw').value}; socket.emit('host:login', cr, r => { if (r && r.ok) { try{sessionStorage.setItem('sgH', JSON.stringify(cr));}catch(e){} afterLogin(); } else $('#lerr').textContent = 'ID કે Password ખોટા છે'; }); };
  $('#lgo').onclick = go; $('#lpw').onkeydown = e => { if (e.key==='Enter') go(); };
}
function afterLogin(){ let c=''; try{c=localStorage.getItem('sgRoom')||'';}catch(e){} if (c) { CODE=c; socket.emit('host:restore', { code:c }, r => { if (r && r.ok) view='game'; else { try{localStorage.removeItem('sgRoom');}catch(e){} CODE=''; createView(); } }); } else createView(); }
function createView(){
  view='create'; app.innerHTML = '<div class="wrap"><div class="card"><h1>નવી ગેમ બનાવો</h1><div class="grid2"><div><label>Host નામ</label><input id="hn" value="Host"></div><div><label>ખેલાડીની મહત્તમ સંખ્યા</label><input id="mp" type="number" value="500"></div><div><label>ઝોન (કોમાથી અલગ, 2–8)</label><input id="zn" value="A,B,C,D,E"></div><div><label>દરેક પ્રશ્નનો સમય (સેકન્ડ)</label><input id="qs" type="number" value="30"></div></div><label>4 ફેઝનાં નામ (કોમાથી અલગ)</label><input id="pnm" placeholder="સૂર્યોદય, મધ્યાહ્ન, સાંજ, રાત્રિ"><label>36 પ્રશ્નો — દરેક લીટીમાં  પ્રશ્ન::જવાબ  (દરેક જવાબ અલગ, 9-9ના 4 ફેઝ)</label><textarea id="qa" rows="14" style="font-family:monospace"></textarea><button class="btn or" id="mk">ગેમ બનાવો</button><div class="err" id="cerr"></div></div></div>';
  fetch('/api/default-questions').then(r=>r.text()).then(t => { $('#qa').value = t; }).catch(()=>{});
  $('#mk').onclick = () => socket.emit('host:create', { hostName:$('#hn').value, maxPlayers:+$('#mp').value, zones:$('#zn').value, qSec:+$('#qs').value, phaseNames:$('#pnm').value.split(',').map(s=>s.trim()), qaText:$('#qa').value }, r => { if (r && r.ok) { CODE=r.code; try{localStorage.setItem('sgRoom',CODE);}catch(e){} view='game'; } else $('#cerr').textContent = (r && r.error) || 'ભૂલ'; });
}
function ctrl(){
  const st=S.status, B=(ev,label,cls,extra,dis)=>'<button class="btn lg '+(cls||'')+'" data-ev="'+ev+'" '+(extra||'')+(dis?' disabled':'')+'>'+label+'</button>';
  if (st==='lobby') return B('host:start','▶ ગેમ શરૂ કરો','or','',!S.nPlayers)+B('host:addBots','🤖 +20 Bots','ghost','data-n="20"');
  if (st==='pick') return B('host:skipPick','⏭ પસંદગી પૂરી કરો','or');
  if (st==='active') return B('host:spin','🎡 નંબર ફેરવો','or');
  if (st==='spinning'||st==='revealing') return '<span class="pill">વ્હીલ ચાલુ…</span>';
  if (st==='question') return B('host:skipTimer','⏩ સમય પૂરો','or')+(S.paused?B('host:resume','▶ ફરી ચાલુ',''):B('host:pause','⏸ થોભો','ghost'))+B('host:adj','+10 સે','ghost','data-delta="10"')+B('host:adj','−10 સે','ghost','data-delta="-10"');
  if (st==='locked') return S.used < (S.phase+1)*S.per ? B('host:spin','🎡 આગલો નંબર ફેરવો','or') : B('host:startYuddh','⚔ યુદ્ધ શરૂ કરો','or');
  if (st==='yuddh') return B('host:skipYuddh','⏭ યુદ્ધ પૂરું','or');
  if (st==='yuddhwait') return B('host:nextPhase', S.phase<3?'➡ આગલો ફેઝ':'🏁 અંતિમ તબક્કો','or');
  if (st==='final') return B('host:final','🎉 પરિણામ શરૂ કરો','or');
  if (st==='reveal') return B('host:prev','◀ પાછળ','ghost','',S.reveal.step===0)+B('host:next','આગળ ▶','or','',S.reveal.step>=S.reveal.steps.length-1)+'<span class="pill">પગલું '+(S.reveal.step+1)+' / '+S.reveal.steps.length+' · '+S.reveal.steps[S.reveal.step]+'</span>';
  return '';
}
function drawHost(){
  const q = (S.questions||[])[(S.qNo||0)-1], plink = location.origin+'/?code='+S.code, pjl = location.origin+'/projector.html?code='+S.code;
  const live = ['question','locked','spinning','revealing'].includes(S.status);
  app.innerHTML = '<a id="hproj" href="'+pjl+'" target="_blank" rel="noopener" aria-label="Projector">📺</a><div class="wrap">'+
  '<div class="card"><div class="row" style="justify-content:space-between"><div><h1>ધ સંગમ · '+esc(S.hostName||'')+'</h1><span class="pill">'+esc((S.phaseNames[Math.min(S.phase,3)]||''))+' · ફેઝ '+(S.phase+1)+'/4</span><span class="pill">'+S.qSec+' સે</span></div><div class="code">'+S.code+'</div></div>'+
  '<div class="row" style="margin:8px 0"><a class="pjbtn" href="'+pjl+'" target="_blank" rel="noopener">📽 Projector Screen ખોલો</a><span class="muted" style="font-size:.82rem">મોટા પડદા/બીજા સ્ક્રીન પર ખોલો અને Full screen કરો. Host આ પેજથી જ ચલાવશે.</span></div></div>'+
  '<div class="card"><div class="muted" style="font-size:.8rem">અત્યારની સ્થિતિ</div><div class="qline">'+SN[S.status]+'</div>'+
  '<div class="stat"><div><small>ખેલાડી</small><b>'+S.nPlayers+'</b></div><div><small>પ્રશ્ન</small><b>'+Math.min(S.used,S.nQ)+' / '+S.nQ+'</b></div>'+(S.status==='question'?'<div><small>સમય</small><b data-tm>'+sec(left())+'</b></div><div><small>નોંધાયું</small><b>'+S.markedNow+' / '+S.nPlayers+'</b></div>':'')+(S.status==='pick'?'<div><small>તૈયાર</small><b>'+S.pickIn+' / '+S.nPlayers+'</b></div>':'')+(S.status==='yuddh'?'<div><small>તૈયાર</small><b>'+S.yIn+' / '+S.nPlayers+'</b></div>':'')+'</div>'+
  (live&&q?'<div class="ans" style="margin-bottom:8px"><div class="muted" style="font-size:.78rem;font-weight:600">પ્રશ્ન '+S.qNo+' (ફક્ત Host માટે)</div>'+esc(q.q)+' &nbsp;→&nbsp; <span style="color:var(--p)">'+esc(q.a)+'</span></div>':'')+
  '<div class="row">'+ctrl()+'</div></div>'+
  (S.byZone && S.status!=='lobby' ? '<div class="card"><h2>ઝોન પ્રમાણે ઝડપ</h2>'+S.zones.map(z=>{const b=S.byZone[z],pc=b.n?Math.round(b.marked/b.n*100):0;return '<div class="zr"><b style="width:3.2rem;color:'+zc(z)+'">'+esc(z)+'</b><div class="bar"><div style="width:'+pc+'%;background:'+zc(z)+'"></div></div><span>'+b.marked+'/'+b.n+'</span></div>';}).join('')+'</div>':'')+
  '<div class="card"><h2>Player link</h2><div class="row"><input id="plk" readonly value="'+plink+'" style="flex:1;min-width:220px"><button class="btn sm" data-copy="'+plink+'">📋 Copy</button><a class="btn sm or" target="_blank" rel="noopener" style="text-decoration:none" href="https://wa.me/?text='+encodeURIComponent('ધ સંગમ ગેમમાં જોડાઓ 👉 '+plink+'  (Room code: '+S.code+')')+'">WhatsApp</a></div>'+
  '<h2 style="margin-top:14px">Colour Theme</h2><div>'+Object.keys(BGTheme.PRESETS).map(k=>'<button class="pre'+(curPre()===k?' on':'')+'" data-pre="'+k+'">'+BGTheme.PRESETS[k].n+'</button>').join('')+'</div>'+'<div class="row" style="margin-top:8px"><label class="cp">Main <input type="color" id="cp1" value="'+THEMEV().p+'"></label><label class="cp">Accent <input type="color" id="cp2" value="'+THEMEV().s+'"></label><label class="cp">Background <input type="color" id="cp3" value="'+THEMEV().bg+'"></label><button class="btn sm" id="cpgo">લાગુ કરો</button></div><div class="muted" style="font-size:.8rem">Host, Projector અને બધા Players ના ફોનમાં એક સાથે રંગ બદલાય છે.</div></div>'+
  '<div class="card"><h2>ખેલાડીઓ ('+S.nPlayers+')</h2><div class="plist">'+(S.players||[]).map(p=>'<span style="border-color:'+zc(p.zone)+'">'+esc(p.avatar)+' '+esc(p.name)+' ('+esc(p.zone)+')'+(p.online?'':' ⚠')+(S.status==='lobby'?' <a href="#" data-kick="'+p.key+'" style="color:var(--red)">✕</a>':'')+'</span>').join('')+'</div></div>'+
  '<div class="card"><h2>સેટિંગ</h2><label>ફેઝનાં નામ</label><input id="nmIn" value="'+esc(S.phaseNames.join(', '))+'"><button class="btn sm" id="nmGo">સેવ</button><div class="row" style="margin-top:8px"><label>પ્રશ્ન સમય (સે)</label><input id="qsIn" type="number" value="'+S.qSec+'" style="width:90px"><button class="btn sm" id="qsGo">સેવ</button></div><div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn sm ghost" data-ev="host:end">⛔ ગેમ સમાપ્ત</button></div><div class="muted" style="font-size:.8rem">Page refresh/બંધ થાય તો ફરી ખોલતાં ગેમ ત્યાંથી જ આગળ ચાલુ રહે છે.</div></div></div>';
  $('#nmGo').onclick = () => emit('host:setNames', { names:$('#nmIn').value.split(',') });
  $('#qsGo').onclick = () => emit('host:setQSec', { sec:+$('#qsIn').value });
}
document.addEventListener('click', e => {
  const pr = e.target.closest('[data-pre]'); if (pr) { const q = BGTheme.PRESETS[pr.dataset.pre]; emit('host:setTheme', { theme:{ p:q.p, s:q.s, bg:q.bg, rainbow:q.rainbow?1:0 } }); return; }
  if (e.target.id==='cpgo') { emit('host:setTheme', { theme:{ p:$('#cp1').value, s:$('#cp2').value, bg:$('#cp3').value, rainbow:0 } }); return; }
  const cp = e.target.closest('[data-copy]'); if (cp) { const t=cp.dataset.copy, done=()=>{cp.textContent='✔ Copied';}, fb=()=>{const i=$('#plk'); i.select(); try{document.execCommand('copy');}catch(_){} done();}; try { navigator.clipboard.writeText(t).then(done, fb); } catch(_) { fb(); } return; }
  const b = e.target.closest('[data-ev]'); if (b) { const a={}; if (b.dataset.n) a.n=+b.dataset.n; if (b.dataset.delta) a.delta=+b.dataset.delta;
    if (b.dataset.ev==='host:end') { if (!b.dataset.sure) { b.dataset.sure=1; b.textContent='ખાતરી? ફરી દબાવો'; return; } try{localStorage.removeItem('sgRoom');}catch(_){} setTimeout(()=>location.reload(),300); }
    emit(b.dataset.ev, a); return; }
  const k = e.target.closest('[data-kick]'); if (k) { e.preventDefault(); emit('host:kick', { key:k.dataset.kick }); }
});
socket.on('state', s => { S = s; try{ BGTheme.sync(S.theme || BGTheme.PRESETS.fun); }catch(e){} if (view==='game') { if (document.activeElement && /^(nmIn|qsIn|plk)$/.test(document.activeElement.id)) return; drawHost(); } });
setInterval(() => { const t=document.querySelector('[data-tm]'); if (t && S) t.textContent = sec(left()); }, 250);
socket.on('connect', () => { let cr=null; try{cr=JSON.parse(sessionStorage.getItem('sgH')||'null');}catch(e){} if (cr) socket.emit('host:login', cr, r => { if (r && r.ok) afterLogin(); else loginView(); }); else loginView(); });
</script>
<script id="up-clock">
/* Server-clock sync: every phone/laptop uses the SAME clock (server time), so timers & number reveal match exactly */
(function(){
  var RAW=Date.now.bind(Date),SK=0,best=1e9,n=0;
  Date.now=function(){ return RAW()+SK; };
  window.__srvSkew=function(){ return SK; };
  function sample(){ try{ var t0=RAW(); socket.emit('time:sync',null,function(st){ if(typeof st!=='number') return; var t1=RAW(),rtt=t1-t0,off=st+rtt/2-t1;
      if(n<6||rtt<=best*1.5+30){ if(rtt<best) best=rtt; SK=(n<3)?off:Math.round(SK*.5+off*.5); n++; } }); }catch(e){} }
  function burst(){ best=1e9; n=0; for(var i=0;i<6;i++) setTimeout(sample,i*250); }
  try{ socket.on('connect',burst); if(socket.connected) burst(); }catch(e){}
  setInterval(sample,20000);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) burst(); });
})();
</script>
