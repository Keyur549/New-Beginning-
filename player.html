<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ધ સંગમ · Player</title>
<link rel="icon" href="logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700&family=Rasa:wght@600;700&family=Hind+Vadodara:wght@400;500;600;700&family=Baloo+Bhai+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--p:#6D28D9;--pd:#2E1065;--o:#F59E0B;--o2:#F97316;--cream:#FFFBF0;--card:#FFFDF7;--ink:#1F1147;--muted:#6B5E8E;--line:#E4DAF7;--soft:#FFF3D6;--green:#16a34a;--red:#dc2626;--pink:#EC4899;--teal:#0D9488;--blue:#3B82F6;
--fh:'Rasa','Noto Serif Gujarati',serif;--fb:'Hind Vadodara','Noto Sans Gujarati','Segoe UI',system-ui,sans-serif;--fn:'Baloo Bhai 2','Hind Vadodara',sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light}
body{margin:0;font-family:var(--fb);color:var(--ink);line-height:1.5;background:radial-gradient(700px 420px at 0% 0%,rgba(245,158,11,.38),transparent 60%),radial-gradient(700px 420px at 100% 10%,rgba(109,40,217,.32),transparent 60%),radial-gradient(800px 500px at 50% 110%,rgba(52,211,153,.26),transparent 60%),#FFFBF0 fixed;min-height:100vh}
h1,h2,h3{font-family:var(--fh);font-weight:700;margin:0;color:var(--pd)}
h1{font-size:1.5rem}h2{font-size:1.2rem}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 16px 16px 20px;margin:12px 0;box-shadow:0 8px 26px rgba(46,16,101,.10);overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(180deg,#ef4444,#f59e0b,#eab308,#22c55e,#06b6d4,#6366f1,#a855f7)}
.btn{display:inline-block;border:none;border-radius:14px;padding:11px 18px;font:700 1rem var(--fb);color:#fff;background:linear-gradient(135deg,var(--p),var(--pd));box-shadow:0 6px 16px rgba(109,40,217,.35);cursor:pointer;margin:4px 6px 4px 0;touch-action:manipulation}
.btn.or{background:linear-gradient(135deg,var(--o),var(--o2));box-shadow:0 6px 16px rgba(249,115,22,.35)}
.btn.ghost{background:transparent;color:var(--p);border:2px solid var(--p);box-shadow:none}
.btn.red{background:linear-gradient(135deg,#ef4444,#b91c1c)}.btn.green{background:linear-gradient(135deg,#22c55e,#15803d)}
.btn:disabled{opacity:.5;cursor:default}
input,textarea{width:100%;padding:11px 12px;border-radius:14px;border:2px solid var(--p);background:#fff;color:var(--ink);font:500 1rem var(--fb);margin:5px 0 10px}
.muted{color:var(--muted);font-size:.9rem}
.pill{display:inline-block;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:.85rem;font-weight:600;margin:2px}
.zchip{display:inline-block;border-radius:999px;padding:4px 14px;font-weight:700;color:#fff;font-size:.9rem}
.big{font-family:var(--fn);font-weight:800}
.bar{height:9px;border-radius:999px;background:var(--line);overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--o),var(--o2));transition:width .3s}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.coin{width:120px;height:120px;display:block;margin:6px auto 0;filter:drop-shadow(0 8px 14px rgba(46,16,101,.35))}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes tileIn{0%{transform:scale(.4) rotate(-12deg);opacity:0;filter:brightness(2)}100%{transform:none;opacity:1}}

.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.avs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 12px}
.av{font-size:1.7rem;padding:8px 0;border-radius:14px;border:2px solid var(--p);background:#fff;cursor:pointer;text-align:center;touch-action:manipulation}
.av.on{background:#EDE5FB;box-shadow:0 0 0 3px rgba(109,40,217,.25)}
.zs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.zb{border-radius:999px;padding:9px 18px;border:2px solid var(--line);background:#fff;font:700 1rem var(--fb);cursor:pointer;touch-action:manipulation}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:10px 0}
.cell{position:relative;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;text-align:center;padding:2px;border-radius:11px;background:#fff;border:1.5px solid var(--line);font:700 1.05rem/1.1 var(--fn);color:var(--ink);overflow:hidden;overflow-wrap:anywhere;touch-action:manipulation;-webkit-user-select:none;user-select:none;cursor:pointer}
.cell.on{background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;border-color:var(--pd)}
.cell.used{background:#EDE5FB;color:#8a7fb0}
.cell.sh{border:2.5px solid var(--o)}
.cell.on.sh{border-color:var(--o)}
.cell svg{position:absolute;right:2px;top:2px}
.cell.dis{cursor:default}
.lines{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.lc{padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font:600 .85rem var(--fb);cursor:pointer;touch-action:manipulation}
.lc.on{background:var(--o);border-color:var(--o);color:#fff}
.qtxt{font-size:1.25rem;font-weight:700;line-height:1.4}
.timer{font-family:var(--fn);font-weight:800;font-size:1.6rem;color:var(--o2)}
.numpop{text-align:center;animation:pop .6s ease-out}.numpop .num{font:800 5rem/1 var(--fn);color:var(--p)}
.zbtn{display:block;width:100%;text-align:left;margin:6px 0;border-radius:14px;padding:12px 14px;border:2px solid var(--line);background:#fff;font:700 1rem var(--fb);cursor:pointer;touch-action:manipulation}
.zbtn.on{border-color:var(--p);background:#EDE5FB}
.pic{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;padding:6px;border-radius:16px;background:var(--line)}
.tile{aspect-ratio:1/1;border-radius:7px;display:flex;align-items:center;justify-content:center;animation:tileIn .55s both}
.tl{display:flex;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin:8px 0}.tl i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.bd{display:flex;justify-content:space-between;padding:3px 0;font-size:.95rem}.bd.hl{color:#B45309;font-weight:700}
.total{font:800 2.2rem var(--fn);color:var(--p)}
.win{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:12px;background:var(--soft);margin:6px 0;font-weight:600}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const ZC = ['#F59E0B','#EC4899','#0D9488','#3B82F6','#22C55E','#8B5CF6','#EF4444','#06B6D4'];
const AV = ['🦁','🐯','🐼','🐵','🦊','🐸','🐧','🦉','🐢','🐝','🌸','⭐','🔥','🚀','👑','🎯'];
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S = null, saved = {}, joinZones = null, joinErr = '', joinAv = AV[0], joinZone = '', joinName = '', joinCode = '';
try { saved = JSON.parse(localStorage.getItem('sangam') || '{}'); } catch(e){}
function save(){ try { localStorage.setItem('sangam', JSON.stringify(saved)); } catch(e){} }
const qs = new URLSearchParams(location.search);
joinCode = (qs.get('code') || saved.code || '').toUpperCase(); joinName = saved.name || '';
const zc = z => ZC[Math.max(0, (S && S.zones || []).indexOf(z)) % ZC.length];

function rejoin(){ if (saved.token && saved.code) socket.emit('player:join', { code:saved.code, token:saved.token }, r => { if (!r || !r.ok) { saved = {}; save(); S = null; render(); } }); }
socket.on('connect', rejoin);
socket.on('state', s => { S = s; render(); });
socket.on('kicked', () => { saved = {}; save(); S = null; render(); });

async function lookup(){
  joinZones = null; joinErr = '';
  if (joinCode.length < 8) return render();
  try { const r = await (await fetch('/api/room/' + joinCode)).json(); if (r.ok) { joinZones = r.zones; if (!r.canJoin) joinErr = 'ગેમ શરૂ થઈ ગઈ છે'; } else joinErr = 'Room code ખોટો છે'; } catch(e){ joinErr = 'નેટવર્ક સમસ્યા'; }
  render();
}
function doJoin(){
  joinName = ($('#nm') && $('#nm').value || '').trim(); joinCode = ($('#cd') && $('#cd').value || '').trim().toUpperCase();
  if (!joinName) { joinErr = 'નામ લખો'; return render(); }
  if (!joinZone) { joinErr = 'Zone પસંદ કરો'; return render(); }
  socket.emit('player:join', { code:joinCode, name:joinName, zone:joinZone, avatar:joinAv }, r => {
    if (r && r.ok) { saved = { code:joinCode, token:r.token, name:joinName }; save(); joinErr = ''; } else { joinErr = (r && r.error) || 'Join ન થયું'; render(); }
  });
}
function pickAv(i){ joinAv = AV[i]; render(); }
function pickZone(z){ joinZone = z; render(); }

// ---- screens ----
const head = () => '<img class="coin" src="logo.svg" alt="">';
function joinScreen(){
  const zs = joinZones ? '<div class="muted">Zone પસંદ કરો</div><div class="zs">' + joinZones.map((z,i) => `<button class="zb" style="${joinZone===z?`background:${ZC[i%ZC.length]};color:#fff;border-color:${ZC[i%ZC.length]}`:''}" onclick="pickZone('${esc(z)}')">${esc(z)}</button>`).join('') + '</div>' : '';
  return head() + `<div class="card"><h2>Player Join</h2>
   <input id="cd" placeholder="Room Code" value="${esc(joinCode)}" autocapitalize="characters" oninput="joinCode=this.value.toUpperCase();if(joinCode.length>=8)lookup()">
   <input id="nm" placeholder="તમારું નામ" value="${esc(joinName)}" maxlength="24">
   <div class="muted">Avatar પસંદ કરો</div><div class="avs">${AV.map((a,i)=>`<div class="av ${a===joinAv?'on':''}" onclick="pickAv(${i})">${a}</div>`).join('')}</div>
   ${zs}${joinErr?`<div style="color:var(--red);font-weight:700;margin:6px 0">${esc(joinErr)}</div>`:''}
   <button class="btn or" onclick="doJoin()">Join Game</button></div>`;
}
function topBar(){
  const m = S.me; return `<div class="top"><div class="row"><span style="font-size:1.6rem">${esc(m.avatar)}</span><b>${esc(m.name)}</b></div><div class="row"><span class="zchip" style="background:${zc(m.zone)}">${esc(m.zone)}</span><span class="pill">${esc(S.phaseNames[S.phase])}</span></div></div>`;
}
function timerHtml(total){ return `<div class="row" style="justify-content:space-between;margin-top:8px"><span class="muted">સમય</span><span class="timer" data-tm="1">0</span></div><div class="bar"><i data-tb="1" style="width:100%"></i></div>`; }
const SHIELD = '<svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M8 1.5 13.5 3.5v4c0 3.2-2.3 5.6-5.5 7-3.2-1.4-5.5-3.8-5.5-7v-4z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';
const LINES = (() => { const L=[]; for(let r=0;r<5;r++)L.push([0,1,2,3,4].map(c=>r*5+c)); for(let c=0;c<5;c++)L.push([0,1,2,3,4].map(r=>r*5+c)); L.push([0,6,12,18,24]);L.push([4,8,12,16,20]); return L; })();
function cardGrid(mode){ // mode: 'pick' | 'play' | 'view'
  const m = S.me, shl = m.shubh != null ? LINES[m.shubh] : [];
  return '<div class="grid">' + m.card.map((a, ci) => {
    const markedQ = m.marks[ci];
    const cur = S.qNo != null ? S.qNo - 1 : -1;
    let cl = 'cell';
    if (mode === 'play') { if (markedQ === cur) cl += ' on'; else if (markedQ !== undefined) cl += ' used'; else if (S.status!=='question') cl += ' dis'; }
    if (mode === 'pick' && m.kavach === ci) cl += ' on';
    if (mode !== 'pick' && markedQ !== undefined && markedQ !== cur) cl += ' used';
    if (shl.includes(ci) && mode !== 'pick') cl += ' sh';
    if (mode === 'pick' && shl.includes(ci)) cl += ' sh';
    const oc = mode === 'pick' ? `onclick="setKavach(${ci})"` : (mode === 'play' && S.status === 'question' ? `onclick="markCell(${ci})"` : '');
    return `<div class="${cl}" ${oc}>${esc(a)}${m.kavach === ci ? SHIELD : ''}</div>`;
  }).join('') + '</div>';
}
function setKavach(ci){ S.me.kavach = ci; render(); sendPick(); }
function setLine(i){ S.me.shubh = i; render(); sendPick(); }
function sendPick(){ socket.emit('player:pick', { code:S.code, shubh:S.me.shubh, kavach:S.me.kavach }); }
function markCell(ci){
  const m = S.me, cur = S.qNo - 1;
  if (m.marks[ci] !== undefined && m.marks[ci] !== cur) return;
  const prev = Object.assign({}, m.marks);
  if (m.marks[ci] === cur) delete m.marks[ci]; else { for (const k of Object.keys(m.marks)) if (m.marks[k] === cur) delete m.marks[k]; m.marks[ci] = cur; }
  render();
  socket.emit('player:mark', { code:S.code, ci }, r => { if (r && r.marks) { m.marks = r.marks; render(); } });
}
function speak(t){ try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'gu-IN'; speechSynthesis.speak(u); } catch(e){} }
function pickScreen(){
  const m = S.me, done = m.shubh != null && m.kavach != null;
  return topBar() + `<div class="card"><h2>તમારી શુભ લાઇન અને કવચ પસંદ કરો</h2>
   <div class="muted">1) નીચેથી એક <b>લાઇન</b> પસંદ કરો. અંતે એ લાઇનના પાંચેય જવાબ સાચા હોય તો <b>+10</b>. ખોટી હોય તો કંઈ ઘટતું નથી.<br>2) કાર્ડમાં એક ખાનું ટેપ કરીને <b>કવચ</b> બનાવો. એ ખાનાનો જવાબ ખોટો હોય તો ટુકડો તૂટતો નથી, ફક્ત ધૂંધળો ખૂલે.</div>
   ${timerHtml()}${cardGrid('pick')}
   <div class="muted">12 લાઇનમાંથી એક (પસંદ કરેલી લાઇન કાર્ડ પર કેસરી બોર્ડરમાં દેખાય છે)</div>
   <div class="lines">${S.lineNames.map((n,i)=>`<div class="lc ${m.shubh===i?'on':''}" onclick="setLine(${i})">${esc(n)}</div>`).join('')}</div>
   <div class="muted" style="margin-top:8px">${done ? '✅ બંને પસંદ થઈ ગયાં. સમય પૂરો થાય ત્યાં સુધી બદલી શકાય.' : 'પસંદ ન કરો તો સમય પૂરો થતાં રેન્ડમ મળશે.'}</div></div>`;
}
function questionScreen(){
  const m = S.me, marked = Object.values(m.marks).includes(S.qNo - 1), q = S.status === 'question';
  return topBar() + `<div class="card"><div class="muted">પ્રશ્ન ${S.qNo}</div><div class="qtxt">${esc(S.q)}</div>
   ${S.qImg?`<img src="${esc(S.qImg)}" style="max-width:100%;max-height:240px;border-radius:12px;margin:8px auto;display:block" onerror="this.style.display='none'">`:''}
   <button class="btn ghost" onclick='speak(${JSON.stringify(S.q)})'>🔊 સાંભળો</button>
   ${q ? timerHtml() : '<div class="muted" style="margin-top:8px">⏱ સમય પૂરો. આગળના પ્રશ્નની રાહ જુઓ…</div>'}
   ${cardGrid('play')}
   <div class="${marked?'':'muted'}" style="font-weight:700;${marked?'color:var(--green)':''}">${marked?'✔ જવાબ નોંધાયો':'તમારા કાર્ડમાં જવાબ શોધીને ટેપ કરો'}</div>
   <div class="muted">સાચું કે ખોટું અંતે જ ખૂલશે. ફરી ટેપ કરો તો જવાબ હટે.</div></div>`;
}
function yuddhScreen(){
  const m = S.me, c = m.yChoice, others = S.zones.filter(z => z !== m.zone);
  return topBar() + `<div class="card"><h2>યુદ્ધ ઘડી</h2><div class="muted">ગુપ્તમાં નક્કી કરો: બીજા ઝોન પર <b>બાણ</b> છોડો કે તમારા ઝોનની <b>ઢાલ</b> બનો. પરિણામ અંતે જ ખૂલશે. ન પસંદ કરો તો કંઈ થશે નહીં.</div>
   ${timerHtml()}
   <div style="margin-top:10px"><b>બાણ કોના પર?</b></div>
   ${others.map(z=>`<button class="zbtn ${c&&c.t==='baan'&&c.z===z?'on':''}" style="border-left:8px solid ${zc(z)}" onclick="yu('baan','${esc(z)}')">🏹 ઝોન ${esc(z)}</button>`).join('')}
   <button class="zbtn ${c&&c.t==='dhal'?'on':''}" style="border-left:8px solid ${zc(m.zone)}" onclick="yu('dhal')">🛡 ઢાલ (ઝોન ${esc(m.zone)} નું રક્ષણ)</button>
   <div class="muted" style="margin-top:6px">${c?'✅ પસંદગી નોંધાઈ. સમય પૂરો થાય ત્યાં સુધી બદલી શકાય.':''}</div></div>`;
}
function yu(t, z){ socket.emit('player:yuddh', { code:S.code, t, z }, r => { if (r && r.ok) { S.me.yChoice = r.choice; render(); } }); }
function waitScreen(txt, sub){ return topBar() + `<div class="card" style="text-align:center"><h2>${txt}</h2><div class="muted">${sub||''}</div></div>`; }
const TILE = {
  C: 'background-image:var(--pic);',
  B: 'background-image:var(--pic);filter:grayscale(1);',
  F: 'background-image:var(--pic);filter:grayscale(1) brightness(.55);opacity:.8;',
  X: 'background:repeating-linear-gradient(135deg,#1F1147 0 5px,#33245f 5px 10px);',
  E: 'background:#E4DAF7;'
};
function revealScreen(){
  const R = S.me.result, rv = S.reveal || {win:{}}, w = rv.win || {};
  if (!R) return waitScreen('અંતિમ રિવીલ', 'થોડી રાહ જુઓ…');
  const order = [...Array(25).keys()].sort(() => Math.random() - .5), dl = {}; order.forEach((ci, i) => dl[ci] = i * 110);
  const shl = R.shubh != null ? LINES[R.shubh] : [];
  const tiles = R.tiles.map((t, ci) => `<div class="tile" style="${TILE[t]}background-size:500% 500%;background-position:${(ci%5)*25}% ${Math.floor(ci/5)*25}%;animation-delay:${dl[ci]}ms;${shl.includes(ci)&&t!=='X'&&t!=='E'?'outline:2.5px solid #F59E0B;outline-offset:-1px;':''}">${ci===R.chinhCi&&(t==='C'||t==='B')?'<svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 2.5l2.9 6.2 6.6.8-4.9 4.6 1.3 6.7L12 17.5 6.1 20.8l1.3-6.7L2.5 9.5l6.6-.8z" fill="#fff" stroke="#F59E0B" stroke-width="1.6"/></svg>':''}</div>`).join('');
  const L = { tiles:'ટુકડા', lines:'ઓટો લાઇન', shubh:'શુભ લાઇન પૂરી', chinh:'ગુપ્ત ચિહ્ન', full:'આખું ચિત્ર પૂરું', duel:'દ્વંદ્વ', baan:'બાણ લાગ્યાં', dhal:'ઢાલથી ઝોન બચ્યો', mitra:'ગુપ્ત મિત્ર મેળ' };
  const bd = Object.keys(R.bd).map(k => `<div class="bd ${k==='shubh'||k==='chinh'||k==='full'?'hl':''}"><span>${L[k]||k}</span><b>+${R.bd[k]}</b></div>`).join('');
  const duels = (R.duels||[]).map(d => `<div class="bd"><span>${esc(S.phaseNames[d.ph])}: ${esc(d.opp)} સામે</span><b>${d.res==='win'?'જીત':d.res==='tie'?'ટાઈ':'હાર'} (${d.me}–${d.they})</b></div>`).join('');
  const names = { z3:'ઝોન 3જો', z2:'ઝોન 2જો', z1:'ઝોન 1લો', p3:'ખેલાડી 3જો', p2:'ખેલાડી 2જો', p1:'ખેલાડી 1લો' };
  const wl = [];
  ['z3','z2','z1'].forEach(k => { if (w[k]) wl.push(`<div class="win"><span>${names[k]}</span><b>ઝોન ${esc(w[k].zone)} · ${w[k].score}</b></div>`); });
  ['p3','p2','p1'].forEach(k => { if (w[k]) wl.push(`<div class="win"><span>${names[k]}</span><b>${esc(w[k].avatar)} ${esc(w[k].name)} · ${w[k].total}</b></div>`); });
  if (w.chinh) wl.push(`<div class="win"><span>ગુપ્ત ચિહ્ન વિજેતા</span><b>${w.chinh.length} ખેલાડી</b></div>`);
  if (w.jodi) wl.push(`<div class="win"><span>જોડીનો રાજા</span><b>${esc(w.jodi.a.name)} + ${esc(w.jodi.b.name)}</b></div>`);
  if (w.pratham) wl.push(`<div class="win"><span>શુભ પ્રથમ</span><b>${esc(w.pratham.avatar)} ${esc(w.pratham.name)}</b></div>`);
  if (w.shiromani) wl.push(`<div class="win"><span>શુભ શિરોમણિ</span><b>${esc(w.shiromani.avatar)} ${esc(w.shiromani.name)}</b></div>`);
  return topBar() + `<div class="card"><h2>તમારું ચિત્ર</h2><div class="pic" style="--pic:url('${esc(S.picture)}')">${tiles}</div>
   <div class="tl"><span><i style="background:linear-gradient(135deg,#F59E0B,#EC4899)"></i>રંગીન</span><span><i style="background:#999"></i>કાળો-સફેદ</span><span><i style="background:#666;opacity:.7"></i>ધૂંધળો</span><span><i style="background:#1F1147"></i>તૂટેલો</span></div></div>
   <div class="card"><h2>તમારો સ્કોર</h2>${bd}${duels}${R.mitra?`<div class="bd"><span>ગુપ્ત મિત્ર: ${esc(R.mitra.name)}</span><b>${R.mitra.matches} મેળ</b></div>`:''}
   <div class="row" style="justify-content:space-between;align-items:baseline;margin-top:6px"><span class="muted">કુલ સ્કોર</span><span class="total">${R.total}</span></div>
   <div style="margin-top:8px"><span class="pill" style="background:linear-gradient(135deg,#FDE68A,#FDBA74)">🏅 ${esc(R.birud)}</span></div></div>
   ${wl.length?`<div class="card"><h2>વિજેતાઓ</h2>${wl.join('')}</div>`:''}
   <div class="muted" style="text-align:center">વિજેતાઓ Host એક પછી એક ખોલશે.</div>`;
}
function render(){
  const app = $('#app'); if (!S || !S.me) { app.innerHTML = joinScreen(); return; }
  const st = S.status; let h = head();
  if (st === 'lobby') h += waitScreen('Host ની રાહ જુઓ…', `રમતમાં ${S.nPlayers} ખેલાડી · તમે ઝોન ${esc(S.me.zone)} માં છો`);
  else if (st === 'pick') h = topBar() + pickScreen().replace(topBar(), '');
  else if (st === 'active') h += waitScreen(esc(S.phaseNames[S.phase]), 'Host વ્હીલ ફેરવે તેની રાહ જુઓ…');
  else if (st === 'spinning') h += waitScreen('🎡 Host વ્હીલ ફેરવી રહ્યા છે…', '');
  else if (st === 'revealing') h += topBar() + `<div class="card numpop"><div class="muted">🎯 પ્રશ્ન નંબર</div><div class="num">${S.qNo}</div></div>`;
  else if (st === 'question' || st === 'locked') h = questionScreen();
  else if (st === 'yuddh') h = yuddhScreen();
  else if (st === 'yuddhwait') h += waitScreen('યુદ્ધનું પરિણામ અંતે ખૂલશે', 'Host આગળ વધે તેની રાહ જુઓ…');
  else if (st === 'final') h += waitScreen('બધા પ્રશ્નો પૂરા!', 'અંતિમ રિવીલની રાહ જુઓ…');
  else if (st === 'reveal') h = revealScreen();
  app.innerHTML = h; fit();
}
function fit(){ document.querySelectorAll('.cell').forEach(c => { c.style.fontSize = ''; let f = parseFloat(getComputedStyle(c).fontSize); let n = 0; while ((c.scrollWidth > c.clientWidth + 1 || c.scrollHeight > c.clientHeight + 1) && f > 8 && n++ < 40) { f -= .5; c.style.fontSize = f + 'px'; } }); }
setInterval(() => {
  if (!S) return;
  const tm = document.querySelector('[data-tm]'), tb = document.querySelector('[data-tb]'); if (!tm) return;
  let end, tot;
  if (S.status === 'pick') { end = S.pickEnd; tot = 60000; } else if (S.status === 'yuddh') { end = S.yuddhEnd; tot = 15000; } else { end = S.timerEnd; tot = S.qSec * 1000; }
  const ms = S.paused ? S.pausedMs : Math.max(0, (end || 0) - Date.now());
  tm.textContent = Math.ceil(ms / 1000) + (S.paused ? ' ⏸' : ''); if (tb) tb.style.width = Math.min(100, ms / tot * 100) + '%';
}, 200);
window.addEventListener('resize', fit);
if (joinCode.length >= 8) lookup(); else render();
</script>
<script>
/* Server-clock sync: all phones and the projector use the SAME clock (server time) */
(function(){var RAW=Date.now.bind(Date),SK=0,best=1e9,n=0;Date.now=function(){return RAW()+SK};
function sample(){try{var t0=RAW();socket.emit('time:sync',null,function(st){if(typeof st!=='number')return;var t1=RAW(),rtt=t1-t0,off=st+rtt/2-t1;if(n<6||rtt<=best*1.5+30){if(rtt<best)best=rtt;SK=(n<3)?off:Math.round(SK*.5+off*.5);n++}})}catch(e){}}
function burst(){best=1e9;n=0;for(var i=0;i<6;i++)setTimeout(sample,i*250)}
try{socket.on('connect',burst);if(socket.connected)burst()}catch(e){}setInterval(sample,20000);document.addEventListener('visibilitychange',function(){if(!document.hidden)burst()})})();
</script>
