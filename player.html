<html lang="gu" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ધ સંગમ · Player</title>
<link rel="icon" href="logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700&family=Rasa:wght@600;700&family=Hind+Vadodara:wght@400;500;600;700&family=Baloo+Bhai+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--p:#6D28D9;--pd:#2E1065;--o:#F59E0B;--o2:#F97316;--cream:#FFFBF0;--card:#FFFDF7;--ink:#1F1147;--muted:#6B5E8E;--line:#E4DAF7;--soft:#FFF3D6;--green:#16a34a;--red:#dc2626;--pink:#EC4899;--teal:#0D9488;--blue:#3B82F6;
--fh:'Rasa','Noto Serif Gujarati',serif;--fb:'Hind Vadodara','Noto Sans Gujarati','Segoe UI',system-ui,sans-serif;--fn:'Baloo Bhai 2','Hind Vadodara',sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light}
body{margin:0;font-family:var(--fb);color:var(--ink);line-height:1.5;background:radial-gradient(700px 420px at 0% 0%,rgba(var(--srg,245,158,11),.38),transparent 60%),radial-gradient(700px 420px at 100% 10%,rgba(var(--rg,109,40,217),.32),transparent 60%),radial-gradient(800px 500px at 50% 110%,rgba(52,211,153,.26),transparent 60%),var(--tcream,#FFFBF0) fixed;min-height:100vh}
h1,h2,h3{font-family:var(--fh);font-weight:700;margin:0;color:var(--pd)}
h1{font-size:1.5rem}h2{font-size:1.2rem}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 16px 16px 20px;margin:12px 0;box-shadow:0 8px 26px rgba(46,16,101,.10);overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(180deg,#ef4444,#f59e0b,#eab308,#22c55e,#06b6d4,#6366f1,#a855f7)}
.btn{display:inline-block;border:none;border-radius:14px;padding:11px 18px;font:700 1rem var(--fb);color:#fff;background:linear-gradient(135deg,var(--p),var(--pd));box-shadow:0 6px 16px rgba(109,40,217,.35);cursor:pointer;margin:4px 6px 4px 0;touch-action:manipulation}
.btn.or{background:linear-gradient(135deg,var(--o),var(--o2));box-shadow:0 6px 16px rgba(249,115,22,.35)}
.btn.ghost{background:transparent;color:var(--p);border:2px solid var(--p);box-shadow:none}
.btn.red{background:linear-gradient(135deg,#ef4444,#b91c1c)}.btn.green{background:linear-gradient(135deg,#22c55e,#15803d)}
.btn:disabled{opacity:.5;cursor:default}
input,textarea{width:100%;padding:11px 12px;border-radius:14px;border:2px solid var(--p);background:#fff;color:var(--ink);font:500 1rem var(--fb);margin:5px 0 10px}
.muted{color:var(--muted);font-size:.9rem}
.pill{display:inline-block;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:.85rem;font-weight:600;margin:2px}
.zchip{display:inline-block;border-radius:999px;padding:4px 14px;font-weight:700;color:#fff;font-size:.9rem}
.big{font-family:var(--fn);font-weight:800}
.bar{height:9px;border-radius:999px;background:var(--line);overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--o),var(--o2));transition:width .3s}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.coin{width:120px;height:120px;display:block;margin:6px auto 0;filter:drop-shadow(0 8px 14px rgba(46,16,101,.35))}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes tileIn{0%{transform:scale(.4) rotate(-12deg);opacity:0;filter:brightness(2)}100%{transform:none;opacity:1}}

.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.avs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 12px}
.av{font-size:1.7rem;padding:8px 0;border-radius:14px;border:2px solid var(--p);background:#fff;cursor:pointer;text-align:center;touch-action:manipulation}
.av.on{background:#EDE5FB;box-shadow:0 0 0 3px rgba(109,40,217,.25)}
.zs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.zb{border-radius:999px;padding:9px 18px;border:2px solid var(--line);background:#fff;font:700 1rem var(--fb);cursor:pointer;touch-action:manipulation}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:10px 0}
.cell{position:relative;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;text-align:center;padding:2px;border-radius:11px;background:#fff;border:1.5px solid var(--line);font:700 1.05rem/1.1 var(--fn);color:var(--ink);overflow:hidden;overflow-wrap:anywhere;touch-action:manipulation;-webkit-user-select:none;user-select:none;cursor:pointer}
.cell.on{background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;border-color:var(--pd)}
.cell.used{background:#EDE5FB;color:#8a7fb0}
.cell.sh{border:2.5px solid var(--o)}
.cell.on.sh{border-color:var(--o)}
.cell svg{position:absolute;right:2px;top:2px}
.cell.dis{cursor:default}
.lines{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.lc{padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font:600 .85rem var(--fb);cursor:pointer;touch-action:manipulation}
.lc.on{background:var(--o);border-color:var(--o);color:#fff}
.qtxt{font-size:1.25rem;font-weight:700;line-height:1.4}
.timer{font-family:var(--fn);font-weight:800;font-size:1.6rem;color:var(--o2)}
.numpop{text-align:center;animation:pop .6s ease-out}.numpop .num{font:800 5rem/1 var(--fn);color:var(--p)}
.zbtn{display:block;width:100%;text-align:left;margin:6px 0;border-radius:14px;padding:12px 14px;border:2px solid var(--line);background:#fff;font:700 1rem var(--fb);cursor:pointer;touch-action:manipulation}
.zbtn.on{border-color:var(--p);background:#EDE5FB}
.pic{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;padding:6px;border-radius:16px;background:var(--line)}
.tile{aspect-ratio:1/1;border-radius:7px;display:flex;align-items:center;justify-content:center;animation:tileIn .55s both}
.tl{display:flex;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin:8px 0}.tl i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.bd{display:flex;justify-content:space-between;padding:3px 0;font-size:.95rem}.bd.hl{color:#B45309;font-weight:700}
.total{font:800 2.2rem var(--fn);color:var(--p)}
.win{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:12px;background:var(--soft);margin:6px 0;font-weight:600}
</style>

@keyframes lsLogo{0%{opacity:0;transform:scale(.55) rotateY(-70deg);filter:blur(14px)}60%{opacity:1;filter:blur(0)}100%{opacity:1;transform:scale(1) rotateY(0);filter:blur(0)}}

<body>
<div class="wrap" id="app"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

const AV = ['🦁','🐯','🐼','🐵','🦊','🐸','🐧','🦉','🐢','🐝','🌸','⭐','🔥','🚀','👑','🎯'];
const $ = s => document.querySelector(s);

async function lookup(){

function pickAv(i){ joinAv = AV[i]; render(); }

function topBar(){

}

const SHIELD = '<svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M8 1.5 13.5 3.5v4c0 3.2-2.3 5.6-5.5 7-3.2-1.4-5.5-3.8-5.5-7v-4z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';

function cardGrid(mode){ // mode: 'pick' | 'play' | 'view'

function setKavach(ci){ S.me.kavach = ci; render(); sendPick(); }

function pickScreen(){

function yuddhScreen(){

const TILE = {

function revealScreen(){

function render(){

  else if (st === 'question' || st === 'locked') h = questionScreen();

  else if (st === 'yuddhwait') h += waitScreen('યુદ્ધનું પરિણામ અંતે ખૂલશે', 'Host આગળ વધે તેની રાહ જુઓ…');
  else if (st === 'final') h += waitScreen('બધા પ્રશ્નો પૂરા!', 'અંતિમ રિવીલની રાહ જુઓ…');
  else if (st === 'reveal') h = revealScreen();
  app.innerHTML = h; fit();
}
function fit(){ document.querySelectorAll('.cell').forEach(c => { c.style.fontSize = ''; let f = parseFloat(getComputedStyle(c).fontSize); let n = 0; while ((c.scrollWidth > c.clientWidth + 1 || c.scrollHeight > c.clientHeight + 1) && f > 8 && n++ < 40) { f -= .5; c.style.fontSize = f + 'px'; } }); }
setInterval(() => {
  if (!S) return;
  const tm = document.querySelector('[data-tm]'), tb = document.querySelector('[data-tb]'); if (!tm) return;
  let end, tot;
  if (S.status === 'pick') { end = S.pickEnd; tot = 60000; } else if (S.status === 'yuddh') { end = S.yuddhEnd; tot = 15000; } else { end = S.timerEnd; tot = S.qSec * 1000; }
  const ms = S.paused ? S.pausedMs : Math.max(0, (end || 0) - Date.now());
  tm.textContent = Math.ceil(ms / 1000) + (S.paused ? ' ⏸' : ''); if (tb) tb.style.width = Math.min(100, ms / tot * 100) + '%';
}, 200);
window.addEventListener('resize', fit);
if (joinCode.length >= 8) lookup(); else render();
