const wcard = (cat,av,name,sub,sc) => '<div class="glass grand"><div class="cat">'+cat+'</div><div class="av">'+(av||'🏆')+'</div><div class="nm">'+esc(name)+'</div><div class="h2">'+sub+'</div>'+(sc!=null?'<div class="sc">'+sc+'</div>':'')+'</div>';
function revealScene(){
  const V=S.reveal, st=V.steps[V.step], w=V.win;
  const strip = () => { const a=[]; ['z3','z2','z1'].forEach(k=>w[k]&&a.push('<div>'+({z3:'🥉',z2:'🥈',z1:'🥇'}[k])+' ઝોન '+esc(w[k].zone)+'</div>')); ['p3','p2','p1'].forEach(k=>w[k]&&a.push('<div>'+({p3:'🥉',p2:'🥈',p1:'🥇'}[k])+' '+esc(w[k].name)+'</div>')); return a.length?'<div class="strip">'+a.join('')+'</div>':''; };
  const med = {z3:'🥉 ઝોન · ત્રીજો ક્રમ',z2:'🥈 ઝોન · બીજો ક્રમ',z1:'🥇 ઝોન · પહેલો ક્રમ',p3:'🥉 ખેલાડી · ત્રીજો ક્રમ',p2:'🥈 ખેલાડી · બીજો ક્રમ',p1:'🥇 ખેલાડી · પહેલો ક્રમ'};
  const K = t => '<div class="kick">ધ સંગમ · અંતિમ પરિણામ</div>' + (t?'<div class="h1" style="font-size:clamp(2rem,6vh,4rem)">'+t+'</div>':'');
  if (st==='tiles') return K('ચિત્ર ખૂલી રહ્યું છે…')+'<div class="glass grand"><div class="cat">તમારા ફોન તરફ જુઓ</div><div class="h2">દરેક ખેલાડી પોતાનું ચિત્ર અને સ્કોર જુએ છે</div></div>';
  if (st==='yuddh'){ const Y=V.yuddh; return K('યુદ્ધનો હિસાબ')+'<div class="zg">'+Y.zones.map(z=>{ let a=0,sh=0,net=0; Y.table.forEach(r=>{const o=r[z]; if(o){a+=o.arrows;sh+=o.shields;net+=o.net;}}); const loss=Y.loss[z]||0, c=zc(z);
    return '<div class="glass zc"><div class="nm"><span>ઝોન '+esc(z)+'</span><span class="dot" style="background:'+c+';color:'+c+'"></span></div><div style="display:flex;height:1.3rem;border-radius:.4rem;overflow:hidden;background:rgba(0,0,0,.35)"><div style="width:'+(100-loss*5)+'%;background:'+c+'"></div><div style="width:'+(loss*5)+'%;background:repeating-linear-gradient(135deg,#c8372d 0 4px,#8f231c 4px 8px)"></div></div><b style="font-size:1.5rem;color:'+(loss?'#fda4a4':'#86efac')+'">'+(loss?'−'+loss.toFixed(1)+'%':'કોઈ નુકસાન નહીં')+'</b><div class="row"><span>⚔ બાણ</span><b>'+a+'</b></div><div class="row"><span>🛡 ઢાલ</span><b>'+sh+'</b></div><div class="row"><span>ચોખ્ખા ફટકા</span><b>'+net+'</b></div></div>'; }).join('')+'</div><div class="h2">નુકસાન % = ચોખ્ખા ફટકા ÷ ઝોનના ખેલાડી × 20% (વધુમાં વધુ 20%)</div>'; }
  if (/^z\d$/.test(st)){ const o=w[st]; return confetti()+K('')+(o?wcard(med[st],'🏰','ઝોન '+o.zone,'સરેરાશ '+o.avg+' · નુકસાન −'+o.loss+'% · '+o.n+' ખેલાડી',o.score):'')+strip(); }
  if (/^p\d$/.test(st)){ const o=w[st]; return confetti()+K('')+(o?wcard(med[st],o.avatar,o.name,'ઝોન '+esc(o.zone),o.total):'')+strip(); }
  if (st==='chinh'){ const a=w.chinh||[]; return confetti()+K('')+'<div class="glass grand"><div class="cat">🎯 ગુપ્ત ચિહ્ન વિજેતા</div><div class="h2" style="margin:.5rem 0 1rem">ખાનું: પંક્તિ '+(Math.floor((V.chinhCi||0)/5)+1)+' · સ્તંભ '+((V.chinhCi||0)%5+1)+' · '+a.length+' જણ (+5)</div><div class="names">'+(a.slice(0,48).map(o=>'<span>'+(o.avatar||'')+' '+esc(o.name)+'</span>').join('')||'<span>કોઈ નહીં</span>')+(a.length>48?'<span>+'+(a.length-48)+'</span>':'')+'</div></div>'; }
  if (st==='jodi'){ const o=w.jodi; return confetti()+K('')+(o?'<div class="glass grand"><div class="cat">🤝 જોડીનો રાજા</div><div class="av">'+o.a.avatar+' '+o.b.avatar+'</div><div class="nm">'+esc(o.a.name)+' + '+esc(o.b.name)+'</div><div class="h2">'+o.n+' પ્રશ્નો બંનેએ સાચા કર્યા</div></div>':'<div class="glass grand"><div class="cat">જોડી નક્કી ન થઈ</div></div>'); }
  if (st==='pratham'){ const o=w.pratham; return confetti()+K('')+(o?wcard('⭐ શુભ પ્રથમ',o.avatar,o.name,'સૌથી પહેલી શુભ લાઇન પૂરી · '+esc(o.line)+' · ઝોન '+esc(o.zone),o.total):'<div class="glass grand"><div class="cat">કોઈએ શુભ લાઇન પૂરી ન કરી</div></div>'); }
  if (st==='shiromani'){ const o=w.shiromani; return confetti()+K('')+(o?wcard('👑 શુભ શિરોમણિ',o.avatar,o.name,'શુભ લાઇન સાથે સૌથી વધુ સ્કોર · ઝોન '+esc(o.zone),o.total):'<div class="glass grand"><div class="cat">કોઈએ શુભ લાઇન પૂરી ન કરી</div></div>')+'<div class="h2">શુભ લાઇન પૂરી કરનાર કુલ: '+V.nShubh+'</div>'; }
  if (st==='chitra'){ const m=V.mosaic||[], N=Math.max(1,m.length); let t=''; for(let i=0;i<25;i++){ const f=m.filter(x=>x>=i+1).length/N; t+='<div style="background-image:url(/chitra/'+CODE+');background-position:'+((i%5)*25)+'% '+(Math.floor(i/5)*25)+'%;opacity:'+(.15+.85*f).toFixed(2)+';filter:grayscale('+(1-f).toFixed(2)+')"></div>'; }
    return confetti()+K('સભાનું ચિત્ર')+'<div class="frame"><div class="mos">'+t+'</div></div><div class="h2">દરેક ખાનું જેટલા ખેલાડીઓએ ખોલ્યું તેટલું ઝળહળે છે · બિરુદ બધાના ફોનમાં</div>'; }
  return K('');
}
function mainHTML(){
  const st=S.status, ph=pn();
  const K=(k,t,sub)=>'<div class="kick">'+k+'</div><div class="h1">'+t+'</div>'+(sub?'<div class="h2">'+sub+'</div>':'');
  if (st==='lobby'){ const url=location.origin+'/?code='+S.code; return '<div style="display:flex;gap:5vw;align-items:center;justify-content:center;flex-wrap:wrap"><div class="qr" id="qr"></div><div style="text-align:left"><div class="kick">સંગમમાં જોડાઓ · ફોન સ્કેન કરો</div><div class="h2" style="margin-top:.5rem">Room Code</div><div class="code">'+S.code+'</div><div class="h2" style="word-break:break-all">'+esc(url)+'</div><div class="big" style="margin-top:.6rem">'+S.nPlayers+' <span class="h2">ખેલાડી</span></div></div></div><div class="zg">'+S.zones.map(z=>'<div class="glass zc"><div class="nm"><span>ઝોન '+esc(z)+'</span><span class="dot" style="background:'+zc(z)+';color:'+zc(z)+'"></span></div><div class="big">'+S.byZone[z].n+'</div></div>').join('')+'</div>'; }
  if (st==='pick') return K(ph,'શુભ લાઇન અને કવચ પસંદ કરો','12 લાઇનમાંથી એક શુભ લાઇન (+10) · કાર્ડનું એક કવચ ખાનું · બીજા કોઈને દેખાશે નહીં')+'<div style="display:flex;gap:1.4rem;align-items:center">'+ring(S.pickSec||60)+'<div class="chip">તૈયાર <b>'+S.pickIn+' / '+S.nPlayers+'</b></div></div>'+zonesBoard();
  if (st==='active'||st==='locked'){ let p=''; for(let i=0;i<S.per;i++) p+='<i class="'+(i<S.used-S.phase*S.per?'on':'')+'"></i>'; return K(ph, st==='locked'?'સમય પૂરો':'આગલો નંબર', st==='locked'?'જવાબ નોંધાઈ ગયા · સાચા-ખોટા અંતે જ ખૂલશે':'')+'<div class="pips">'+p+'</div>'+zonesBoard(); }
  if (st==='spinning'||st==='revealing') return '<div class="kick">'+ph+'</div><div class="wheel"><div class="ptr"></div>'+wheelHTML(S.wheelNums||[1])+'</div>'+(st==='revealing'?'<div class="numbadge">'+S.qNo+'</div>':'');
  if (st==='question') return '<div class="top" style="width:100%;justify-content:center;gap:1.6rem"><div class="kick">'+ph+' · પ્રશ્ન '+S.qNo+'</div>'+ring(S.qSec)+'<div class="chip">નોંધાયું <b>'+S.markedNow+' / '+S.nPlayers+'</b></div></div><div class="qtxt">'+esc(S.q||'')+'</div>'+(S.qImg?'<img class="qimg" src="/'+encodeURI(S.qImg)+'" onerror="this.remove()">':'')+zonesBoard();
  if (st==='yuddh'||st==='yuddhwait') return K(ph+' પછી', st==='yuddh'?'⚔ બાણ કે 🛡 ઢાલ?':'યુદ્ધ પૂરું', st==='yuddh'?'ગુપ્ત પસંદગી · કોણે શું કર્યું તે અંતે ખૂલશે':'પરિણામ અંતિમ રિવીલમાં')+(st==='yuddh'?'<div style="display:flex;gap:1.4rem;align-items:center">'+ring(S.yuddhSec||15)+'<div class="chip">તૈયાર <b>'+S.yIn+' / '+S.nPlayers+'</b></div></div>':'')+zonesBoard();
  if (st==='final') return confetti()+K('ધ સંગમ','બધા પ્રશ્નો પૂરા!','હવે અંતિમ પરિણામનો સમય — ખાનાં ખૂલશે, ચિત્ર બનશે');
  if (st==='reveal') return revealScene();
  return '';
}
function draw(){
  if (!S) return; try{ BGTheme.sync(S.theme || BGTheme.PRESETS.fun); }catch(e){}
  if (!splashed) { splashed = true; try{ showLogoSplash('ધ સંગમ'); }catch(e){} }
  const k=[S.status,S.spinAt,S.qNo].join('|'); if ((S.status==='spinning'||S.status==='revealing') && sig===k && $('#wg')) return; sig=k;
  const chips = S.status==='lobby'||S.status==='reveal'||S.status==='final' ? '' : '<span class="chip">પ્રશ્ન <b>'+Math.min(S.used,S.nQ)+' / '+S.nQ+'</b></span><span class="chip">ખેલાડી <b>'+S.nPlayers+'</b></span>';
  const splash = '';
  app.innerHTML = splash+'<div class="top"><div class="brand"><img src="logo.svg" alt="">THE SANGAM</div><div class="chips">'+chips+'</div></div><div class="main">'+mainHTML()+'</div>';
  const q=$('#qr'); if (q && window.makeQrSvg) q.innerHTML = window.makeQrSvg(location.origin+'/?code='+S.code, 300);
  if (S.status==='spinning'||S.status==='revealing') spinWheel();
}
setInterval(()=>{ if(!S) return; const l=left(), t=document.querySelector('[data-tm]'); if(t) t.textContent = S.status==='yuddh'&&S.yuddhEnd ? sec(S.yuddhEnd-Date.now()) : S.status==='pick'&&S.pickEnd ? sec(S.pickEnd-Date.now()) : sec(l);
  const r=document.querySelector('.ring'); if(r){ let rem=l, tot=S.qSec*1000; if(S.status==='yuddh'){ rem=S.yuddhEnd-Date.now(); tot=(S.yuddhSec||15)*1000; } if(S.status==='pick'){ rem=S.pickEnd-Date.now(); tot=(S.pickSec||60)*1000; } const f=Math.max(0,Math.min(1,rem/tot)); r.querySelector('.fg').style.strokeDashoffset=(2*Math.PI*40*(1-f)).toFixed(1); } },200);
socket.on('state', s => { S = s; draw(); });
socket.on('connect', () => { socket.emit('pj:join', { code:CODE }, r => { if (!r || !r.ok) app.innerHTML = '<div class="main"><div class="h1">કોડ સાચો નથી</div><div class="h2">'+esc(CODE)+'</div></div>'; }); });
if (!CODE) app.innerHTML = '<div class="main"><div class="h1">ધ સંગમ · Projector</div><div class="h2">Host પેજ પરથી "📽 Projector ખોલો" દબાવો</div></div>';
</script>
<script id="up-clock">
/* Server-clock sync: every phone/laptop uses the SAME clock (server time), so timers & number reveal match exactly */
(function(){
  var RAW=Date.now.bind(Date),SK=0,best=1e9,n=0;
  Date.now=function(){ return RAW()+SK; };
  window.__srvSkew=function(){ return SK; };
  function sample(){ try{ var t0=RAW(); socket.emit('time:sync',null,function(st){ if(typeof st!=='number') return; var t1=RAW(),rtt=t1-t0,off=st+rtt/2-t1;
      if(n<6||rtt<=best*1.5+30){ if(rtt<best) best=rtt; SK=(n<3)?off:Math.round(SK*.5+off*.5); n++; } }); }catch(e){} }
  function burst(){ best=1e9; n=0; for(var i=0;i<6;i++) setTimeout(sample,i*250); }
  try{ socket.on('connect',burst); if(socket.connected) burst(); }catch(e){}
  setInterval(sample,20000);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) burst(); });
})();
</script>
