<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b1055"/><stop offset=".45" stop-color="#c2410c"/><stop offset=".75" stop-color="#fbbf24"/><stop offset="1" stop-color="#fde68a"/></linearGradient>
<linearGradient id="st" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1d0"/><stop offset="1" stop-color="#e0b070"/></linearGradient>
